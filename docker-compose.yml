# 一条命令起全套：docker compose up -d --build
# 说明：MySQL 8 / Redis 7 用官方镜像；app 用上面的 Dockerfile。
# 密钥只从 .env 读取，不写进本文件。
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: news_app
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p123456"]
      interval: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    # 容器里访问同 compose 网络的服务，用服务名而不是 localhost
    environment:
      DATABASE_URL: mysql+aiomysql://root:123456@mysql:3306/news_app?charset=utf8mb4
      REDIS_HOST: redis
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  mysql_data:
